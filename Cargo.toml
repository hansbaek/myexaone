[workspace]
members = ["crates/exaone-core", "crates/exaone-cli"]
# Tauri 앱은 자체 빌드 설정(app/src-tauri)을 쓰므로 워크스페이스에서 뺍니다.
exclude = ["app"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Hans Baek"]
license = "MIT"

[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3"
dirs = "7.0.0"
portable-pty = "0.9.0"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native"] }
rpassword = "7.5.5"
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
ureq = { version = "3.5.2", features = ["json"] }
uuid = { version = "1.29.2", features = ["v4"] }
which = "8.0.6"
