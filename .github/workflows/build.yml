name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # 0단계 핵심 확인: LiteLLM 게이트웨이가 각 OS에서 뜨고 변환이 맞는지 (API 키 불필요)
  gateway-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install gateway runtime
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv -r requirements.txt
      - name: Smoke test
        env:
          PYTHONUTF8: "1"
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then PY=.venv/Scripts/python.exe; else PY=.venv/bin/python; fi
          "$PY" tests/smoke_gateway.py

  # 1단계: exaone 명령(Rust)을 단위 테스트하고, 실제 Claude Code·Codex·MCP로 끝까지 시험
  cli:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release
      - name: Install Claude Code and Codex
        run: npm install -g @anthropic-ai/claude-code @openai/codex
      - name: End-to-end (mock upstream)
        run: bash tests/e2e_cli.sh
      - uses: actions/upload-artifact@v4
        with:
          name: exaone-cli-${{ runner.os }}
          path: |
            target/release/exaone
            target/release/exaone.exe
          if-no-files-found: error

  app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: app,dmg
          - os: windows-latest
            bundles: nsis,msi
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      # 앱에 넣을 uv (npm run bundle-uv 가 복사한다)
      - uses: astral-sh/setup-uv@v6
      - run: npm ci
      - run: npm run tauri build -- --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: exaone-studio-${{ runner.os }}
          path: |
            app/src-tauri/target/release/bundle/dmg/*.dmg
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
